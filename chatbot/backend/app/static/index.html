<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NVIDIA Balance Sheet Analyst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E2A1A;--sub:#4F5B4A;--muted:#7C8578;--accent:#5E9400;--accent-bright:#76B900;--soft:#F3F7EC;
--divider:#E6ECDD;--border:#CFD8C3;--card:#FFFFFF;--page:#F4F5F2;--good:#3E7B3A;--bad:#B5483D;--dark:#121812;
--radius:12px;--font:'Jost',system-ui,-apple-system,Segoe UI,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E9EFE2;--sub:#B9C3AF;--muted:#8E9886;
--soft:#1C2618;--divider:#263022;--border:#33402D;--card:#151C13;--page:#0E130D;--accent:#8FCB2B}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--page);color:var(--ink);font-family:var(--font)}
.layout{display:flex;height:100vh;gap:16px;padding:16px}
.report{flex:1.6;border-radius:var(--radius);overflow:hidden;background:var(--card);display:none}
.report iframe{width:100%;height:100%;border:0}
.layout.with-report .report{display:block}
.chat{flex:1;min-width:300px;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--card);
border-radius:var(--radius);overflow:hidden;border:1px solid var(--divider)}
.layout.with-report .chat{margin:0}
header{padding:18px 20px 14px;border-bottom:1px solid var(--divider)}
.badge{display:inline-flex;gap:6px;align-items:center;font-size:9px;font-weight:600;letter-spacing:2px;color:var(--accent);
background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px}
h1{font-size:17px;font-weight:500;margin-top:8px}
.subtitle{font-size:11px;font-weight:300;color:var(--sub);margin-top:2px}
#log{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.msg{font-size:13px;line-height:1.6;max-width:100%;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--soft);border:1px solid var(--border);padding:8px 12px;border-radius:12px 12px 2px 12px;max-width:85%}
.msg.bot ul{margin:6px 0 6px 18px}.msg.bot strong{font-weight:600}
.status{font-size:10px;letter-spacing:.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent-bright);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:9px;font-weight:600;letter-spacing:1px;padding:3px 8px;border-radius:999px;border:1px solid var(--border);color:var(--sub)}
.chip.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.chip.warn{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.sources{margin-top:8px;font-size:11px;color:var(--sub)}
.sources a{color:var(--accent);text-decoration:none}.sources a:hover{text-decoration:underline}
.error{color:var(--bad);font-size:12px}
.suggest{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px 10px}
.suggest button{font:inherit;font-size:11px;color:var(--sub);background:transparent;border:1px solid var(--border);
border-radius:999px;padding:5px 10px;cursor:pointer}
.suggest button:hover{color:var(--accent);border-color:var(--accent)}
form{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--divider)}
textarea{flex:1;resize:none;font:inherit;font-size:13px;color:var(--ink);background:var(--page);border:1px solid var(--border);
border-radius:10px;padding:9px 12px;height:42px;outline:none}
textarea:focus{border-color:var(--accent)}
button.send{font:inherit;font-weight:500;font-size:13px;color:#fff;background:var(--accent);border:0;border-radius:10px;padding:0 16px;cursor:pointer}
button.send:disabled{opacity:.5;cursor:default}
footer{font-size:9px;color:var(--muted);text-align:center;padding:0 16px 10px}
@media (max-width:820px){.layout{flex-direction:column;padding:0}.report{min-height:50vh}.chat{max-width:none;border-radius:0}}
</style>
</head>
<body>
<div class="layout" id="layout">
  <div class="report" id="report"></div>
  <section class="chat" aria-label="Chat with the analyst">
    <header>
      <span class="badge">AI ANALYST · GROUNDED IN SEC FILINGS</span>
      <h1>Ask about NVIDIA's balance sheet</h1>
      <p class="subtitle">Answers come only from the NVIDIA Financials semantic model, with SEC evidence.</p>
    </header>
    <div id="log" role="log" aria-live="polite"></div>
    <div class="suggest" id="suggest"></div>
    <form id="form">
      <textarea id="q" placeholder="e.g. How has total equity changed over the last 8 quarters?" aria-label="Your question"></textarea>
      <button class="send" id="send" type="submit">Ask</button>
    </form>
    <footer>Not investment advice · Source: SEC EDGAR companyfacts · Powered by Claude</footer>
  </section>
</div>
<script>
// Optional query params: ?report=<Power BI embed/publish-to-web URL>&fy=2026&fq=2&page=Snapshot&api=<backend base URL>
const params = new URLSearchParams(location.search);
const API = (params.get("api") || "").replace(/\/$/, "");
const reportUrl = params.get("report");
if (reportUrl && /^https:\/\/app\.(powerbi\.com|fabric\.microsoft\.com)\//.test(reportUrl)) {
  const f = document.createElement("iframe");
  f.src = reportUrl; f.title = "Power BI report"; f.allowFullscreen = true;
  document.getElementById("report").appendChild(f);
  document.getElementById("layout").classList.add("with-report");
}
const ctx = {
  fiscal_year: params.get("fy") ? Number(params.get("fy")) : null,
  fiscal_quarter: params.get("fq") ? Number(params.get("fq")) : null,
  page: params.get("page"),
};
const history = [];
const log = document.getElementById("log"), form = document.getElementById("form"),
      q = document.getElementById("q"), send = document.getElementById("send");

const SUGGESTIONS = ["What is NVIDIA's net cash position?", "Show revenue for the last 8 quarters",
  "How liquid is the balance sheet?", "Where does total assets come from? Cite the filing."];
const sg = document.getElementById("suggest");
SUGGESTIONS.forEach(s => { const b = document.createElement("button"); b.type = "button"; b.textContent = s;
  b.onclick = () => { q.value = s; form.requestSubmit(); }; sg.appendChild(b); });

function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(md){ // minimal, safe markdown: escape first, then bold + bullet lists + line breaks
  const lines = esc(md).split("\n"); let html = "", inList = false;
  for (const raw of lines) {
    const l = raw.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    if (/^\s*[-•*]\s+/.test(l)) { if (!inList) { html += "<ul>"; inList = true; } html += "<li>" + l.replace(/^\s*[-•*]\s+/, "") + "</li>"; }
    else { if (inList) { html += "</ul>"; inList = false; } html += l ? l + "<br>" : "<br>"; }
  }
  return html + (inList ? "</ul>" : "");
}
function add(cls, html){ const d = document.createElement("div"); d.className = "msg " + cls; d.innerHTML = html; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = q.value.trim(); if (!question || send.disabled) return;
  q.value = ""; send.disabled = true; sg.style.display = "none";
  add("user", esc(question));
  const bot = add("bot", ""); const status = document.createElement("div"); status.className = "status"; status.textContent = "Thinking";
  bot.appendChild(status);
  const body = document.createElement("div"); bot.appendChild(body);
  let answer = "";
  try {
    const res = await fetch(API + "/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, history, report_context: ctx }) });
    if (!res.ok) { const j = await res.json().catch(() => ({})); throw new Error(j.detail || ("HTTP " + res.status)); }
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
    while (true) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!chunk.startsWith("data: ")) continue;
        const ev = JSON.parse(chunk.slice(6));
        if (ev.type === "status") status.textContent = ev.text;
        else if (ev.type === "text") { answer += ev.text; body.innerHTML = render(answer); log.scrollTop = log.scrollHeight; }
        else if (ev.type === "evidence") {
          const s = document.createElement("div"); s.className = "sources";
          s.innerHTML = "<strong>SEC evidence</strong><br>" + ev.items.map(r =>
            `${esc(r.line_item || r.concept)} · ${esc(String(r.period_end).slice(0,10))} · ${esc(r.form)} ` +
            (/^https:\/\/www\.sec\.gov\//.test(r.sec_url || "") ? `<a href="${esc(r.sec_url)}" target="_blank" rel="noopener">${esc(r.accn)}</a>` : esc(r.accn))).join("<br>");
          bot.appendChild(s);
        } else if (ev.type === "done") {
          status.remove();
          const g = ev.grounding || {}; const m = document.createElement("div"); m.className = "meta";
          if (g.status === "verified") m.innerHTML = `<span class="chip ok">✓ ${g.checked} FIGURES VERIFIED AGAINST THE MODEL</span>`;
          else if (g.status === "unverified") m.innerHTML = `<span class="chip warn" title="${esc((g.ungrounded||[]).join(", "))}">⚠ ${g.ungrounded.length} FIGURE(S) NOT FOUND IN THE DATA - VERIFY</span>`;
          m.innerHTML += `<span class="chip">${ev.dax_queries} DAX QUER${ev.dax_queries === 1 ? "Y" : "IES"}</span>`;
          bot.appendChild(m);
        } else if (ev.type === "error") { status.remove(); body.insertAdjacentHTML("beforeend", `<p class="error">${esc(ev.message)}</p>`); }
      }
    }
    if (answer) { history.push({ role: "user", content: question }, { role: "assistant", content: answer }); }
  } catch (err) {
    status.remove(); body.innerHTML = `<p class="error">${esc(err.message || "Request failed")}</p>`;
  } finally { send.disabled = false; q.focus(); }
});
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
</script>
</body>
</html>
